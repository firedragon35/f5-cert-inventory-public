# scripts/check.conf - repo-specific settings for scripts/check.sh
# Both scripts, the README current-version line and the newest CHANGELOG heading must agree, and
# the newest vX.Y.Z tag must not be ahead of them.
version_sync() {
  local script v2 changelog readme
  script=$(ver_from Get-F5LtmInventory.ps1 'Version: [0-9]+\.[0-9]+\.[0-9]+')
  v2=$(ver_from Get-F5LtmInventory_v2.ps1 'Version: [0-9]+\.[0-9]+\.[0-9]+')
  changelog=$(ver_from CHANGELOG.md '^## \[[0-9]+\.[0-9]+\.[0-9]+\]')
  readme=$(ver_from README.md 'Current version: \*\*[0-9]+\.[0-9]+\.[0-9]+\*\*')
  expect_same "scripts, changelog and README" "$script" "$v2" "$changelog" "$readme"
  tag_check "$script"
}
